<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>

    <!-- Preload critical logo asset with high fetch priority for LCP optimization -->
    <link rel="preload" as="image" href="/assets/logo.png" fetchpriority="high" />

    <!-- Load MaterialCommunityIcons font so @expo/vector-icons renders correctly on web -->
    <style>
      @font-face {
        font-family: 'MaterialCommunityIcons';
        src: url('https://raw.githubusercontent.com/oblador/react-native-vector-icons/master/Fonts/MaterialCommunityIcons.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      html, body, #root {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        min-height: 100%;
        -webkit-overflow-scrolling: touch;
        margin: 0px;
        padding: 0px;
        overflow-x: hidden;
      }
      #root {
        flex-shrink: 0;
        flex-basis: auto;
        flex-grow: 1;
        display: flex;
        flex: 1;
        width: 100%;
        height: 100%;
      }
      html {
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
      }
      body {
        display: flex;
        overflow-y: auto;
        overscroll-behavior-y: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -ms-overflow-style: scrollbar;
        background-color: #F8FAFC;
      }
      /* Pre-render shell for immediate LCP paint prior to JS bundle execution */
      .app-preloader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100vh;
        background-color: #ffffff;
      }
      .app-logo {
        width: 140px;
        height: 140px;
        object-fit: contain;
      }
    </style>
  </head>

  <body>
    <noscript>
      <form action="" style="background-color:#fff;position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;">
        <div style="font-size:18px;font-family:Helvetica,sans-serif;line-height:24px;margin:10%;width:80%;">
          <p>Oh no! It looks like JavaScript is not enabled in your browser.</p>
        </div>
      </form>
    </noscript>
    <!-- The root element for your Expo app with pre-rendered LCP image shell -->
    <div id="root">
      <div class="app-preloader">
        <img src="/assets/logo.png" alt="V-Care Logo" class="app-logo" fetchpriority="high" decoding="async" />
      </div>
    </div>
  </body>
</html>
